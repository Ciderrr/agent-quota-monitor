[package]
name = "agent-quota-monitor"
version = "0.2.2"
edition = "2021"
description = "Portable-first account-level AI quota monitor (Local First)"
license = "Apache-2.0"

[lib]
name = "agent_quota_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"   # 体积优先（本应用常驻空闲，性能无感）；保持默认 panic=unwind（调度器 panic 隔离依赖它）
