<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Quota Monitor</title>
    <script>
      // 必须在 CSS/React 之前定主题，否则 CSS 变量未定义 → 白屏/白底
      (function () {
        var d = document.documentElement;
        d.dataset.theme = "dark";
        d.dataset.tauri = typeof window !== "undefined" && "__TAURI_INTERNALS__" in window ? "1" : "0";
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
